<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slingfall</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="top">
      <div id="hud" class="hud">
        <span>Score <b data-hud="score">0</b></span>
        <span>Shots <b data-hud="shots">0</b></span>
        <span>Tick <b data-hud="tick">0 / 0</b></span>
        <span>Pull <b data-hud="pull">–</b></span>
        <span id="simulating" class="simulating" hidden>simulating…</span>
      </div>
      <div id="chain-info" class="chain-info" hidden></div>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="result" class="result" hidden>
      <div class="result-head">
        <h2 data-result="title"></h2>
        <button id="result-toggle" type="button" aria-controls="result" aria-expanded="true">Hide</button>
      </div>
      <p data-result="summary"></p>
      <table data-result="outputs"></table>
      <div class="result-buttons">
        <button id="copy-inputs" type="button">Copy inputs</button>
        <button id="retry-result" type="button">Retry</button>
      </div>
    </div>
    <div id="controls" class="controls">
      <select id="level" aria-label="Level"></select>
      <button id="retry" type="button">Retry</button>
      <button id="play" type="button">Play</button>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Scrub" />
      <span id="hint" class="hint"></span>
    </div>
    <div id="rotate" class="rotate" role="dialog" aria-modal="true" aria-labelledby="rotate-title">
      <svg class="rotate-icon" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
        <rect class="rotate-phone-body" x="22" y="6" width="20" height="36" rx="4" />
        <path d="M14 52a22 22 0 0 0 36 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        <path d="M52 44l-2 9-8-4" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p id="rotate-title" class="rotate-title">Rotate your phone</p>
      <p class="rotate-text">Slingfall plays in landscape. The game waits for you.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
