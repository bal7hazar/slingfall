name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nested executable package, outside the root workspace (enable-gas = false).
  REPLAY: crates/slingfall_replay/Scarb.toml

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb fmt --check --workspace
      - run: scarb --manifest-path "$REPLAY" fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb lint --workspace --deny-warnings
      - run: scarb --manifest-path "$REPLAY" lint --deny-warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb build --workspace
      - run: scarb --manifest-path "$REPLAY" build
      - name: Execute the replay (one_block, one shot)
        run: |
          python3 tools/tracec/tracec.py args fixtures/levels/one_block.felts.json --shot=-600,-392 --out args.json
          scarb --manifest-path "$REPLAY" execute --executable-name main --arguments-file args.json --print-program-output --print-resource-usage

  test:
    # One job per crate; the `steps` job checks the snapshot on the merged logs.
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [slingfall_testing, slingfall_level, slingfall_rules, slingfall_game, slingfall_contract, slingfall_replay]
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v6
      - name: Run tests
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -o pipefail
          args=(--tracked-resource cairo-steps --detailed-resources)
          if [ "$CRATE" = slingfall_replay ]; then
            # Nested executable package (enable-gas = false): tests run under its `snforge` profile.
            (cd crates/slingfall_replay && snforge test --profile snforge "${args[@]}") | tee "snforge-$CRATE.log"
          else
            snforge test -p "$CRATE" "${args[@]}" | tee "snforge-$CRATE.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snforge-${{ matrix.crate }}
          path: snforge-${{ matrix.crate }}.log

  steps:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: snforge-*
          merge-multiple: true
      - name: Check the Cairo-steps snapshot
        run: |
          cat snforge-*.log > snforge.log
          python3 scripts/steps.py check --from-log snforge.log
      - name: Steps delta summary
        if: always()
        run: python3 scripts/steps.py diff --from-log snforge.log >> "$GITHUB_STEP_SUMMARY"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  vm:
    # cairo-vm wasm worker (client/vm/README.md): runner unit tests, wasm build, then the client
    # tests that run the wasm (bit-exact chunk chaining). Optional: not in `all-checks`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/vm/vendor
            client/vm/tools
            client/vm/runner/target
          key: vm-${{ hashFiles('client/vm/runner/Cargo.lock', 'client/vm/runner/rust-toolchain.toml', 'client/vm/runner/cairo-vm-reserve.patch') }}
          restore-keys: vm-
      # rustup installs the toolchain and wasm32 target of client/vm/runner/rust-toolchain.toml.
      - name: Build the wasm runner
        run: client/vm/scripts/build.sh
      - name: Runner unit tests
        working-directory: client/vm/runner
        run: cargo test -j 4 --lib
      # The committed client executables must be what crates/slingfall_replay builds (lot G4c).
      - uses: software-mansion/setup-scarb@v1
      - name: Committed executables are up to date
        run: |
          client/vm/scripts/fetch-executables.sh --build
          git diff --exit-code -- client/vm/fixtures/replay/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client tests on the wasm
        working-directory: client
        run: npm ci && npm test

  golden:
    # Determinism and budget (tools/golden, lot G5): main, main_trace and chained init / step_chunk
    # agree on the 10 outputs and equal the committed goldens, `main` stays under its step ceiling,
    # then a fixed-seed input fuzz. One job per level fixture (`scarb execute` costs ~10 s per call).
    name: golden (${{ matrix.level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [pile10, cores3, one_block]
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: python3 tools/golden/golden.py to-cairo --check
      - run: scarb --manifest-path "$REPLAY" build
      - name: Goldens
        run: python3 tools/golden/golden.py run --check --no-build --github --level ${{ matrix.level }}
      - name: Input fuzzing (fixed seed)
        run: python3 tools/golden/golden.py fuzz --seed 5 --n 6 --no-build --level ${{ matrix.level }}

  all-checks:
    # The single required check: green only when every job above is.
    if: always()
    needs: [fmt, lint, build, test, steps, golden, client]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
