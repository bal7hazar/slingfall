name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only pull requests share a group (one per branch: a new push cancels the superseded run). A push to main
# gets a group per commit and a dispatch one per run, so that GitHub's single pending slot per group never
# replaces a queued main run or a queued dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'workflow_dispatch' && github.run_id) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Cairo compiler's Sierra is not deterministic across threads (docs/proving.md "Deterministic
  # builds"): the class hashes, the program hash and the step snapshots all depend on it, so every job
  # compiles on one thread.
  RAYON_NUM_THREADS: 1
  # Nested executable package, outside the root workspace (enable-gas = false).
  REPLAY: crates/slingfall_replay/Scarb.toml

jobs:
  changes:
    # Which jobs a pull request concerns (the owner's rule: a test runs only when files related to it
    # changed). Computed from the changed paths, never from a label. On a push to main and on a dispatch
    # every row is true and docs_only false: the full CI. A change to the toolchain or the workflow
    # (`toolchain` below) triggers every row. `docs_only` is true when every changed path ends in `.md`
    # (no CI job reads a .md as a checked artefact today); it is false when the file list is unavailable.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ github.event_name == 'pull_request' && steps.docs.outputs.docs_only == 'true' }}
      cairo: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cairo == 'true' }}
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
      test: ${{ github.event_name != 'pull_request' || steps.filter.outputs.test == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.filter.outputs.client == 'true' }}
      golden: ${{ github.event_name != 'pull_request' || steps.filter.outputs.golden == 'true' }}
      prove: ${{ github.event_name != 'pull_request' || steps.filter.outputs.prove == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
      play: ${{ github.event_name != 'pull_request' || steps.filter.outputs.play == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docs only (every changed path is a .md)
        id: docs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          # --no-renames: a rename lists both the old and the new path (renaming code to .md is not docs-only).
          if files=$(git diff --no-renames --name-only "$BASE...$HEAD"); then
            echo "changed paths:"; echo "$files"
            # An empty list is vacuously docs-only; any path that is not a .md makes it false.
            if [ -z "$(printf '%s\n' "$files" | grep -v -e '^$' | grep -v -e '\.md$' || true)" ]; then docs_only=true; fi
          else
            echo "::warning::the changed-file list is unavailable: docs_only=false"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            toolchain: &toolchain
              - '.tool-versions'
              - 'Scarb.toml'
              - 'Scarb.lock'
              - '**/Scarb.toml'
              - '**/Scarb.lock'
              - '.github/workflows/**'
            cairo:
              - *toolchain
              - 'crates/**'
            build:
              - *toolchain
              - 'crates/**'
              - 'tools/classsize/**'
              - 'tools/tracec/**'
              - 'fixtures/levels/**'
            test:
              - *toolchain
              - 'crates/**'
              - 'fixtures/**'
              - 'steps/**'
              - 'scripts/steps.py'
            client:
              - *toolchain
              - 'client/**'
              - 'crates/**'
              - 'fixtures/**'
              - 'services/prove/**'
              - 'deploy/sepolia.json'
              - 'deploy/sepolia.env.example'
            golden:
              - *toolchain
              - 'crates/**'
              - 'fixtures/**'
              - 'tools/golden/**'
              - 'tools/tracec/**'
              - 'tools/levelc/**'
            prove:
              - *toolchain
              - 'tools/prove/**'
              - 'tools/tracec/**'
              - 'tools/levelc/**'
              - 'crates/**'
              - 'fixtures/levels/**'
              - 'fixtures/golden/**'
              - 'fixtures/proofs/**'
            e2e:
              - *toolchain
              - 'services/**'
              - 'deploy/**'
              - 'crates/**'
              - 'tools/settle/**'
              - 'tools/atlantic/**'
              - 'tools/golden/**'
              - 'tools/tracec/**'
              - 'tools/levelc/**'
              - 'fixtures/levels/**'
              - 'fixtures/golden/**'
              - 'fixtures/proofs/**'
              - 'client/src/chain/**'
              - 'client/package*.json'
            play:
              - *toolchain
              - 'scripts/play.sh'
              - 'scripts/play/**'
              - 'deploy/**'
              - 'services/**'
              - 'crates/**'
              - 'tools/atlantic/**'
              - 'tools/golden/**'
              - 'tools/tracec/**'
              - 'tools/levelc/**'
              - 'fixtures/levels/**'
              - 'fixtures/golden/**'
              - 'client/**'
              - 'fixtures/**'
              - 'services/prove/**'
              - 'deploy/sepolia.json'
              - 'deploy/sepolia.env.example'

  fmt:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.cairo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      - run: scarb fmt --check --workspace
      - run: scarb --manifest-path "$REPLAY" fmt --check

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.cairo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      - run: scarb lint --workspace --deny-warnings
      - run: scarb --manifest-path "$REPLAY" lint --deny-warnings

  build:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      - run: scarb build --workspace
      - name: Registry class within the Starknet class limits
        run: python3 tools/classsize/classsize.py check --no-build
      - name: Split game classes within the class-size gates (margins in the job summary)
        run: python3 tools/classsize/classsize.py split --no-build --github
      - run: scarb --manifest-path "$REPLAY" build
      - name: Execute the replay (one_block, one shot)
        run: |
          python3 tools/tracec/tracec.py args fixtures/levels/one_block.felts.json --shot=-600,-392 --out args.json
          scarb --manifest-path "$REPLAY" execute --executable-name main --arguments-file args.json --print-program-output --print-resource-usage
      - name: Deterministic build (the split classes built twice from clean have the same bytes)
        run: |
          set -euo pipefail
          for run in 1 2; do
            scarb clean
            scarb build -p slingfall_split
            sha256sum target/dev/slingfall_split_*.contract_class.json | sort -k2 > "classes-$run.sha256"
          done
          if ! diff -u classes-1.sha256 classes-2.sha256; then
            echo "::error::two clean one-thread builds of slingfall_split gave different classes"
            exit 1
          fi
          wc -l < classes-1.sha256 | xargs echo "identical classes:"

  test:
    # One job per crate; the `steps` job checks the snapshot on the merged logs.
    name: test (${{ matrix.crate }})
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [slingfall_testing, slingfall_level, slingfall_rules, slingfall_game, slingfall_contract, slingfall_split, slingfall_replay]
    steps:
      - uses: actions/checkout@v7
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      # No retry here: setup-snfoundry is a composite action and wretry.action runs only JavaScript and Docker
      # actions (wrapped, every test leg failed in seconds).
      - uses: foundry-rs/setup-snfoundry@v6
      - name: Run tests
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -o pipefail
          args=(--tracked-resource cairo-steps --detailed-resources)
          if [ "$CRATE" = slingfall_replay ]; then
            # Nested executable package (enable-gas = false): tests run under its `snforge` profile.
            (cd crates/slingfall_replay && snforge test --profile snforge "${args[@]}") | tee "snforge-$CRATE.log"
          else
            snforge test -p "$CRATE" "${args[@]}" | tee "snforge-$CRATE.log"
          fi
      # The pinned class hashes are CI's (docs/proving.md "Deterministic builds": they depend on the build
      # root): `Run tests` prints the stale default pins, this step the stale probe pins, each as
      # `pin <class> <hash>` (`crates/slingfall_split/scripts/pin.py --from-log`).
      - name: Probe class hashes (feature probes) and the build root
        if: always() && matrix.crate == 'slingfall_split'
        working-directory: crates/slingfall_split
        run: |
          echo "build root: $GITHUB_WORKSPACE"
          snforge test test_pinned_probe_hashes --features probes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snforge-${{ matrix.crate }}
          path: snforge-${{ matrix.crate }}.log

  steps:
    # Exactly when `test` runs: same output; a skipped `test` skips this job too.
    needs: [changes, test]
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: snforge-*
          merge-multiple: true
      - name: Check the Cairo-steps snapshot
        run: |
          cat snforge-*.log > snforge.log
          python3 scripts/steps.py check --from-log snforge.log
      - name: Steps delta summary
        if: always()
        run: python3 scripts/steps.py diff --from-log snforge.log >> "$GITHUB_STEP_SUMMARY"

  client:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: client-build-sepolia
        # The Sepolia build (client/.env.sepolia); its entry script must carry deploy/sepolia.json's address.
        run: |
          npm run build:sepolia
          node scripts/smoke-sepolia.mjs

  pages:
    # The hosted client (docs/testers.md "Hosted build"): by hand only (Actions > CI > Run workflow),
    # never on push or pull request. The owner enables Pages (Settings > Pages > Source: GitHub
    # Actions); until then the deploy step fails and nothing is published. The wasm runner is built
    # here as in `vm` (the hosted page runs the Cairo replay in the browser); the optional
    # repository variable SLINGFALL_PROVE_URL (a public prover service, with CORS) is inlined.
    if: github.event_name == 'workflow_dispatch'
    # Its own group on the ref: the last dispatch wins over a still-queued earlier one, and no push to main
    # can replace a pending dispatch (the workflow-level group is per run for a dispatch).
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/vm/vendor
            client/vm/tools
            client/vm/runner/target
          key: vm-${{ hashFiles('client/vm/runner/Cargo.lock', 'client/vm/runner/rust-toolchain.toml', 'client/vm/runner/cairo-vm-reserve.patch') }}
          restore-keys: vm-
      - name: Build the wasm runner
        run: client/vm/scripts/build.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build the client for Sepolia
        working-directory: client
        env:
          # The project site lives under /<repository>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PROVE_URL: ${{ vars.SLINGFALL_PROVE_URL }}
        run: |
          npm ci
          npm run build:sepolia
          node scripts/smoke-sepolia.mjs dist "$VITE_BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deploy
        uses: actions/deploy-pages@v4

  vm:
    # cairo-vm wasm worker (client/vm/README.md): runner unit tests, wasm build, then the client
    # tests that run the wasm (bit-exact chunk chaining).
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/vm/vendor
            client/vm/tools
            client/vm/runner/target
          key: vm-${{ hashFiles('client/vm/runner/Cargo.lock', 'client/vm/runner/rust-toolchain.toml', 'client/vm/runner/cairo-vm-reserve.patch') }}
          restore-keys: vm-
      # rustup installs the toolchain and wasm32 target of client/vm/runner/rust-toolchain.toml.
      - name: Build the wasm runner
        run: client/vm/scripts/build.sh
      - name: Runner unit tests
        working-directory: client/vm/runner
        run: cargo test -j 4 --lib
      # The committed client executables must be what crates/slingfall_replay builds (lot G4c).
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      - name: Committed executables are up to date
        run: |
          client/vm/scripts/fetch-executables.sh --build
          git diff --exit-code -- client/vm/fixtures/replay/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client tests on the wasm
        working-directory: client
        run: npm ci && npm test

  golden:
    # Determinism and budget (tools/golden, lot G5): `check`: main, main_trace and chained init /
    # step_chunk agree on the 10 outputs and equal the committed goldens, `main` stays under its
    # step ceiling; `fuzz`: a fixed-seed input fuzz. One job per level fixture and kind (`scarb
    # execute` costs ~10 s per call), so that no leg nears the 8 minutes of cores3's former single leg.
    name: golden (${{ matrix.level }}, ${{ matrix.kind }})
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.golden == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [pile10, cores3, one_block, tower, bridge, twin]
        kind: [check, fuzz]
    steps:
      - uses: actions/checkout@v7
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      - if: matrix.kind == 'check'
        run: python3 tools/golden/golden.py to-cairo --check
      - run: scarb --manifest-path "$REPLAY" build
      - name: Goldens
        if: matrix.kind == 'check'
        run: python3 tools/golden/golden.py run --check --no-build --github --level ${{ matrix.level }}
      - name: Input fuzzing (fixed seed)
        if: matrix.kind == 'fuzz'
        run: python3 tools/golden/golden.py fuzz --seed 5 --n 6 --no-build --level ${{ matrix.level }}

  prove:
    # Local Stwo proving (tools/prove, lot P1, docs/proving.md): build stwo-cairo's run_and_prove /
    # verify (cached by rev and patches), prove one_block-miss (2.8M steps, ~7 GiB) with the
    # canonical_small preprocessed trace, re-verify it and check its outputs against the golden,
    # then the tamper tests. ~3 min with the build cached, ~13 min cold (the prover build alone is
    # ~9.5 min on the runner's 4 cores). The measurement legs of
    # the pull request (pile10 / cores3 chunked, fixtures/proofs/) were a matrix on this job.
    name: prove (one_block-miss)
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.prove == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Restore and save apart, so that the build is cached even when a later step fails.
      - uses: actions/cache/restore@v4
        id: stwo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/prove/vendor
          key: stwo-cairo-467d5c6-${{ hashFiles('tools/prove/*.patch', 'tools/prove/setup.sh') }}
          restore-keys: stwo-cairo-467d5c6-
      # rustup installs the toolchain of the clone's rust-toolchain.toml.
      - name: Build the prover
        run: tools/prove/setup.sh
      - uses: actions/cache/save@v4
        if: steps.stwo.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/prove/vendor
          key: stwo-cairo-467d5c6-${{ hashFiles('tools/prove/*.patch', 'tools/prove/setup.sh') }}
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      - run: scarb --manifest-path "$REPLAY" build
      - name: Decoding tests
        run: python3 tools/prove/test_prove.py
      - name: Prove and verify
        run: python3 tools/prove/prove.py --case one_block-miss --out prove-out
      - name: Re-verify every proof of the run
        run: python3 tools/prove/verify.py --run prove-out
      - name: Tamper tests
        env:
          PROVE_RUN: prove-out
        run: python3 tools/prove/test_prove.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-one_block-miss
          path: |
            prove-out/*.json
            prove-out/*.log

  e2e:
    # Lot G9 (docs/e2e.md): attest.py unit tests, then deploy/e2e.sh on a local starknet-devnet
    # (release binary): deploy, replay the pile10 reference shot for the devnet account, attest,
    # submit, best / leaderboard, the nullifier.
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: attest.py unit tests
        run: python3 -m unittest discover -s services/attest -v
      - name: tools/atlantic and prove service unit tests (E3b)
        run: |
          python3 -m unittest discover -s tools/atlantic -p 'test_*.py' -v
          python3 -m unittest discover -s services/prove -v
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm --prefix client ci
      # Contract v2's class on Sepolia was compiled by Scarb 2.19.4, and another compiler gives another
      # class hash: deploy/v2.sh builds it here with 2.19.4 (checked against deploy/sepolia.json), and
      # deploy/e2e.sh reuses that build. Then the toolchain of .tool-versions for everything else.
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            scarb-version: 2.19.4
      - name: Contract v2's class (Scarb 2.19.4, as declared on Sepolia)
        run: deploy/v2.sh
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      - run: scarb --version
      - run: scarb --manifest-path "$REPLAY" build
      - name: End to end on the devnet
        run: deploy/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: deploy/out/

  play-local:
    # Lot L1 (docs/play-local.md): `scripts/play.sh up` on a fresh runner, without the wasm runner
    # (PLAY_NO_VM=1: nothing here opens the page), then the page's own calls through the dev server
    # (scripts/play/check.ts: provisional, proven by the fake SNIP-36 prover, settled on the
    # FakeSatellite by the relay, both boards), `status`, `down`, and a second `up` from the saved
    # devnet state. L4's shell tests (the devnet shim, the play instance) run first.
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.play == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAY_NO_VM: 1
    steps:
      - uses: actions/checkout@v7
      - uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
        with:
          action: software-mansion/setup-scarb@v1
          attempt_limit: 3
          attempt_delay: 10000
      # The replay is a nested workspace: its target is not in setup-scarb's cache.
      - uses: actions/cache@v4
        with:
          path: crates/slingfall_replay/target
          key: replay-target-${{ hashFiles('Scarb.lock', 'crates/**/Scarb.toml', 'crates/**/*.cairo') }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: doctor
        run: scripts/play.sh doctor
      # L4's shell tests (lot L4: the devnet shim and the play instance), before the cold up.
      - name: Devnet shim and play instance tests
        run: |
          bash scripts/play/test_devnet_shim.sh
          bash scripts/play/test_play_instance.sh
      - name: up (cold)
        run: scripts/play.sh up
      - name: A shot through the page's calls (provisional, proven, settled)
        run: node scripts/play/check.ts
      - run: scripts/play.sh status
      - run: scripts/play.sh down
      - name: up again (the saved devnet state), status, down
        run: |
          start=$SECONDS
          scripts/play.sh up
          echo "second up: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          scripts/play.sh status
          scripts/play.sh down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-local
          path: target/play/*.log

  all-checks:
    # The single required check, always run so that `gh pr checks` always returns a result. Green when `changes`
    # succeeded and every job either succeeded or was skipped by the path rule: a job whose output is exactly
    # 'true' must be `success`, one whose output is exactly 'false' (or docs_only 'true') must be `skipped`;
    # anything else (an empty output, a failure, a cancellation, a skip while the output was true) fails.
    # `pages` (dispatch only) is not in it. vm, prove, e2e and play-local joined it after three green runs
    # on main each (docs/briefs/cp-ci-paths.md).
    if: always()
    needs: [changes, fmt, lint, build, test, steps, golden, client, vm, prove, e2e, play-local]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that had to run succeeded, every skip was by the rule
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          # job:output:result
          JOBS: >-
            fmt:${{ needs.changes.outputs.cairo }}:${{ needs.fmt.result }}
            lint:${{ needs.changes.outputs.cairo }}:${{ needs.lint.result }}
            build:${{ needs.changes.outputs.build }}:${{ needs.build.result }}
            test:${{ needs.changes.outputs.test }}:${{ needs.test.result }}
            steps:${{ needs.changes.outputs.test }}:${{ needs.steps.result }}
            golden:${{ needs.changes.outputs.golden }}:${{ needs.golden.result }}
            client:${{ needs.changes.outputs.client }}:${{ needs.client.result }}
            vm:${{ needs.changes.outputs.client }}:${{ needs.vm.result }}
            prove:${{ needs.changes.outputs.prove }}:${{ needs.prove.result }}
            e2e:${{ needs.changes.outputs.e2e }}:${{ needs.e2e.result }}
            play-local:${{ needs.changes.outputs.play }}:${{ needs.play-local.result }}
        run: |
          fail=0
          echo "changes: result=$CHANGES docs_only=$DOCS_ONLY"
          [ "$CHANGES" = success ] || { echo "::error::changes did not succeed"; fail=1; }
          case "$DOCS_ONLY" in true | false) ;; *) echo "::error::docs_only is '$DOCS_ONLY'"; fail=1 ;; esac
          for entry in $JOBS; do
            job=${entry%%:*}; rest=${entry#*:}; out=${rest%%:*}; res=${rest#*:}
            if [ "$DOCS_ONLY" = true ]; then want=skipped
            elif [ "$out" = true ]; then want=success
            elif [ "$out" = false ]; then want=skipped
            else want="a known output"; fi
            if [ "$res" = "$want" ]; then verdict=ok; else verdict=FAIL; fail=1; fi
            printf '%-11s output=%-6s result=%-9s want=%s %s\n' "$job" "${out:-<empty>}" "$res" "$want" "$verdict"
          done
          exit "$fail"
