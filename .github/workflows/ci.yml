name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nested executable package, outside the root workspace (enable-gas = false).
  REPLAY: crates/slingfall_replay/Scarb.toml

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb fmt --check --workspace
      - run: scarb --manifest-path "$REPLAY" fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb lint --workspace --deny-warnings
      - run: scarb --manifest-path "$REPLAY" lint --deny-warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - run: scarb build --workspace
      - name: Registry class within the Starknet class limits
        run: python3 tools/classsize/classsize.py check --no-build
      - run: scarb --manifest-path "$REPLAY" build
      - name: Execute the replay (one_block, one shot)
        run: |
          python3 tools/tracec/tracec.py args fixtures/levels/one_block.felts.json --shot=-600,-392 --out args.json
          scarb --manifest-path "$REPLAY" execute --executable-name main --arguments-file args.json --print-program-output --print-resource-usage

  test:
    # One job per crate; the `steps` job checks the snapshot on the merged logs.
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [slingfall_testing, slingfall_level, slingfall_rules, slingfall_game, slingfall_contract, slingfall_replay]
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - uses: foundry-rs/setup-snfoundry@v6
      - name: Run tests
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -o pipefail
          args=(--tracked-resource cairo-steps --detailed-resources)
          if [ "$CRATE" = slingfall_replay ]; then
            # Nested executable package (enable-gas = false): tests run under its `snforge` profile.
            (cd crates/slingfall_replay && snforge test --profile snforge "${args[@]}") | tee "snforge-$CRATE.log"
          else
            snforge test -p "$CRATE" "${args[@]}" | tee "snforge-$CRATE.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snforge-${{ matrix.crate }}
          path: snforge-${{ matrix.crate }}.log

  steps:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: snforge-*
          merge-multiple: true
      - name: Check the Cairo-steps snapshot
        run: |
          cat snforge-*.log > snforge.log
          python3 scripts/steps.py check --from-log snforge.log
      - name: Steps delta summary
        if: always()
        run: python3 scripts/steps.py diff --from-log snforge.log >> "$GITHUB_STEP_SUMMARY"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  vm:
    # cairo-vm wasm worker (client/vm/README.md): runner unit tests, wasm build, then the client
    # tests that run the wasm (bit-exact chunk chaining). Optional: not in `all-checks`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/vm/vendor
            client/vm/tools
            client/vm/runner/target
          key: vm-${{ hashFiles('client/vm/runner/Cargo.lock', 'client/vm/runner/rust-toolchain.toml', 'client/vm/runner/cairo-vm-reserve.patch') }}
          restore-keys: vm-
      # rustup installs the toolchain and wasm32 target of client/vm/runner/rust-toolchain.toml.
      - name: Build the wasm runner
        run: client/vm/scripts/build.sh
      - name: Runner unit tests
        working-directory: client/vm/runner
        run: cargo test -j 4 --lib
      # The committed client executables must be what crates/slingfall_replay builds (lot G4c).
      - uses: software-mansion/setup-scarb@v1
      - name: Committed executables are up to date
        run: |
          client/vm/scripts/fetch-executables.sh --build
          git diff --exit-code -- client/vm/fixtures/replay/
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client tests on the wasm
        working-directory: client
        run: npm ci && npm test

  golden:
    # Determinism and budget (tools/golden, lot G5): `check`: main, main_trace and chained init /
    # step_chunk agree on the 10 outputs and equal the committed goldens, `main` stays under its
    # step ceiling; `fuzz`: a fixed-seed input fuzz. One job per level fixture and kind (`scarb
    # execute` costs ~10 s per call), so that no leg nears the 8 minutes of cores3's former single leg.
    name: golden (${{ matrix.level }}, ${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [pile10, cores3, one_block, tower, bridge, twin]
        kind: [check, fuzz]
    steps:
      - uses: actions/checkout@v7
      - uses: software-mansion/setup-scarb@v1
      - if: matrix.kind == 'check'
        run: python3 tools/golden/golden.py to-cairo --check
      - run: scarb --manifest-path "$REPLAY" build
      - name: Goldens
        if: matrix.kind == 'check'
        run: python3 tools/golden/golden.py run --check --no-build --github --level ${{ matrix.level }}
      - name: Input fuzzing (fixed seed)
        if: matrix.kind == 'fuzz'
        run: python3 tools/golden/golden.py fuzz --seed 5 --n 6 --no-build --level ${{ matrix.level }}

  prove:
    # Local Stwo proving (tools/prove, lot P1, docs/proving.md): build stwo-cairo's run_and_prove /
    # verify (cached by rev and patches), prove one_block-miss (2.8M steps, ~7 GiB) with the
    # canonical_small preprocessed trace, re-verify it and check its outputs against the golden,
    # then the tamper tests. Optional: not in `all-checks` (a cold build of the prover alone takes
    # longer than the 12 minutes a required check may take).
    name: prove (${{ matrix.case }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.measure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: one_block-miss, mode: whole, args: "", measure: false}
          - {case: pile10-reference, mode: chunks2, args: "--chunks 2", measure: true}
          - {case: pile10-reference, mode: chunks3, args: "--chunks 3", measure: true}
          - {case: pile10-reference, mode: whole-cwp, args: "--params tools/prove/params.canonical_without_pedersen.json", measure: true}
          - {case: cores3-reference, mode: whole-cwp, args: "--params tools/prove/params.canonical_without_pedersen.json", measure: true}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/prove/vendor
          key: stwo-cairo-467d5c6-${{ hashFiles('tools/prove/*.patch', 'tools/prove/setup.sh') }}
          restore-keys: stwo-cairo-467d5c6-
      # rustup installs the toolchain of the clone's rust-toolchain.toml.
      - name: Build the prover
        run: tools/prove/setup.sh
      - uses: software-mansion/setup-scarb@v1
      - run: scarb --manifest-path "$REPLAY" build
      - name: Decoding tests
        run: python3 tools/prove/test_prove.py
      - name: Prove and verify
        run: python3 tools/prove/prove.py --case ${{ matrix.case }} ${{ matrix.args }} --out prove-out
      - name: Re-verify every proof of the run
        run: python3 tools/prove/verify.py --run prove-out
      - name: Tamper tests
        if: startsWith(matrix.mode, 'whole')
        env:
          PROVE_RUN: prove-out
        run: python3 tools/prove/test_prove.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-${{ matrix.case }}-${{ matrix.mode }}
          path: |
            prove-out/*.json
            prove-out/*.log

  all-checks:
    # The single required check: green only when every job above is.
    if: always()
    needs: [fmt, lint, build, test, steps, golden, client]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
