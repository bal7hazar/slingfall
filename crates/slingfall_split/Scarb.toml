[package]
name = "slingfall_split"
description = "Spike S36a: the game's chunk on declared classes (SNIP-36), sizes and steps measured."
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"
license = "MIT"
repository = "https://github.com/bal7hazar/slingfall"
publish = false

[workspace]

[dependencies]
starknet = "2.19.4"
fixed = "0.3.0"
glam = "0.3.0"
rapier2d = "=0.1.0-alpha.7"
rapier2d_classes = "=0.1.0-alpha.7"
slingfall_level = { path = "shims/slingfall_level" }
slingfall_rules = { path = "shims/slingfall_rules" }
slingfall_game = { path = "shims/slingfall_game" }

[dev-dependencies]
snforge_std = "0.61.0"
assert_macros = "2.19.4"

# The library's Sierra program (`.sierra.json`): per-function attribution of the classes'
# code (`scripts/attribution.py`).
[lib]
sierra = true

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = ["rapier2d_classes::*"]

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
tracked_resource = "cairo-steps"
max_n_steps = 400000000

[tool.fmt]
sort-module-level-items = true
max-line-length = 100
