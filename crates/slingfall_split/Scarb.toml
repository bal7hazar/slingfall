[package]
name = "slingfall_split"
description = "The game's chunk on declared classes (SNIP-36): layout (e) `WorldClass`, fallback (b) `FallbackGame` + `StepClass`."
version.workspace = true
edition.workspace = true
cairo-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
starknet.workspace = true
fixed.workspace = true
glam_core.workspace = true
rapier2d.workspace = true
rapier2d_classes.workspace = true
# The `ForceEventStage` signature's `NarrowPhase` (the tick-hook emulation, `src/probes/stages.cairo`).
rapier_dynamics2d.workspace = true
# The pebble as a `rapier2d_classes::BodyInsert` (`crate::world::pebble_insert`).
rapier_core.workspace = true
rapier_geometry2d.workspace = true
slingfall_level = { path = "../slingfall_level" }
slingfall_rules = { path = "../slingfall_rules" }
slingfall_game.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

[features]
default = []
# The measured alternatives of the S36a spike: layouts (a), (c), (d), (f) and the size fixtures
# (`src/probes/`). Never in the default build: `snforge test --features probes`.
probes = []

# The library's Sierra program (`.sierra.json`): per-function attribution of the classes'
# code (`scripts/attribution.py`).
[lib]
sierra = true

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = [
    "rapier2d_classes::edits::WorldEditClass",
    "rapier2d_classes::contact::ContactBallClass",
    "rapier2d_classes::advance::SolveAdvanceClass",
    "rapier2d_classes::islands::IslandsClass",
    "rapier2d_classes::broad_phase::BroadPhaseClass",
    "rapier2d_classes::mass::MassClass",
    "rapier2d_classes::narrow::NarrowPhaseClass",
    "rapier2d_classes::active_set::ActiveSetClass",
]

[tool]
fmt.workspace = true
scarb.workspace = true
snforge.workspace = true
