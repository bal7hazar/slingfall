[package]
name = "slingfall_replay"
description = "Slingfall replay executables: proof build, trace build, chunked build (docs/DESIGN.md D1)."
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"
license = "MIT"
repository = "https://github.com/bal7hazar/slingfall"

# Kept out of the root workspace (as rapier-cairo/examples/ball_drop): an executable target needs
# `[cairo] enable-gas = false`, which the snforge-tested workspace crates do not use. Build with
# `scarb --manifest-path crates/slingfall_replay/Scarb.toml build`.
[workspace]

[dependencies]
# Same pins as the root `Scarb.toml` (two sources of `fixed` would mean two `Fixed` types).
fixed = "0.3.0"
glam = "0.3.0"
rapier2d = "=0.1.0-alpha.1"
slingfall_game = { path = "../slingfall_game" }
slingfall_level = { path = "../slingfall_level" }
slingfall_rules = { path = "../slingfall_rules" }
cairo_execute = "2.19.4"

[dev-dependencies]
snforge_std = "0.61.0"
assert_macros = "2.19.4"
slingfall_testing = { path = "../slingfall_testing" }

# Five executables of the same package (`scarb execute --executable-name <name>`), plus the library
# target the tests use.
[lib]

[[target.executable]]
name = "main"
function = "slingfall_replay::main::main"

[[target.executable]]
name = "main_trace"
function = "slingfall_replay::trace::main_trace"

[[target.executable]]
name = "init"
function = "slingfall_replay::chunk::init"

[[target.executable]]
name = "step_chunk"
function = "slingfall_replay::chunk::step_chunk"

[[target.executable]]
name = "outputs"
function = "slingfall_replay::outputs::outputs"

[cairo]
enable-gas = false

# `snforge test` refuses `enable-gas = false`: tests run under this profile
# (`snforge test --profile snforge`), the executable keeps the default one.
[profile.snforge]
inherits = "dev"

[profile.snforge.cairo]
enable-gas = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# As the root workspace: whole-shot tests run 40-80M Cairo steps (the chained K = 1 run the most).
[tool.snforge]
max_n_steps = 400000000

[tool.fmt]
sort-module-level-items = true
max-line-length = 100
