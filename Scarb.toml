[workspace]
# `crates/slingfall_replay` is an executable (`enable-gas = false`) and is kept out of this
# snforge-tested workspace: it is a nested package with its own `[workspace]` (as
# rapier-cairo/examples/ball_drop). Build it with `scarb --manifest-path crates/slingfall_replay/Scarb.toml`.
members = [
    "crates/slingfall_testing",
    "crates/slingfall_level",
    "crates/slingfall_rules",
    "crates/slingfall_game",
    "crates/slingfall_contract",
]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.19.4"
license = "MIT"
repository = "https://github.com/bal7hazar/slingfall"

[workspace.dependencies]
# Physics and scalars by registry version only (docs/DESIGN.md D11); pre-releases pinned exactly,
# a bump is its own PR with the golden fixtures regenerated. `crates/slingfall_replay/Scarb.toml`
# repeats these pins: two sources of `fixed` would mean two `Fixed` types.
fixed = "0.3.0"
glam = "0.3.0"
rapier2d = "=0.1.0-alpha.1"
starknet = "2.19.4"
snforge_std = "0.61.0"
assert_macros = "2.19.4"
slingfall_game = { path = "crates/slingfall_game" }

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[workspace.tool.fmt]
sort-module-level-items = true
max-line-length = 100

[workspace.tool.snforge]
tracked_resource = "cairo-steps"
# Whole-shot tests run 20-60M Cairo steps (G3); the default cap is ~10M.
max_n_steps = 400000000

[scripts]
steps = "python3 scripts/steps.py snapshot"
steps-check = "python3 scripts/steps.py check"
